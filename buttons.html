<style>
    .subscribe{ 
        background-color: rgba(200, 0, 0);
        color: white;
        box-shadow: black;
        border: none;
        padding-left: 10px;
        padding-right: 10px;
        height: 30px;
        background:-moz-element();
        border-radius: 3px;
        cursor: pointer;
        font-size: 20px;
        margin-right: 8px;
        transition: opacity 0.15s;;
        }
        .subscribe:hover
        {
            opacity: .1;
        }
        .subscribe:active{
            opacity: .4;
            background-color: rgb(255, 8, 8);
        }

    .join{
        background-color: white;
        color: rgba(0, 94, 255, 0.881);
        height: 30px;
        width: 60px;
        align-content: center;
        cursor: pointer;
        border-color: rgba(0, 94, 255, 0.881);
        border-style: solid;
        border-width: 1px;
        border-radius: 3px;
        margin-right: 10px;
        transition: background-color .5s, color .5s;
    }
    .join:hover{
        background-color: rgba(0, 94, 255, 0.881);
        color: white;
    }
    .join:active{
        opacity: .7;
    }
    .tweet{
        border-radius: 15px;
        background-color: rgba(5, 139, 248, 0.881);
        color: white;
        border: none;
        height: 30px;
        width: 70px;
        font-size: 20px;
        text-align: center;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
        
    }
    .tweet:hover{
        box-shadow: 10px;
        box-shadow: 5px 5px 20px rgba(0,0,0,.15);

    }

</style>
<button class="subscribe">
    SUBSCRIBE
</button>

<button class="join">
    JOIN
</button>
<button class = "tweet">
    Tweet
</button>
